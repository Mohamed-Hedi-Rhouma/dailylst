# @package _global_
trainer:
  _target_: pytorch_lightning.Trainer
  default_root_dir: ${log_dir}
  max_epochs: 60                          # 1 warmup + cosine cycles of 20 and 40 epochs (tamrf schedule)
  accelerator: 'auto'
  devices: 1
  precision: '16-mixed'                   # half the activation memory; '32-true' if the losses go nan
  gradient_clip_val: 1.0                  # max gradient norm
  check_val_every_n_epoch: 1              # validation, figures and checkpoints every epoch
  log_every_n_steps: 50
  num_sanity_val_steps: 2
