# @package _global_
defaults:
  - _self_
  - location: local                       # local or kaggle
  - datamodule: lst
  - network: lst
  - loss: lst
  - training_module: lst
  - callbacks: default
  - trainer: default
  - loggers: default
  - log_dir: default
  - optional experiments: null

name: dailylst_run_1                      # run folder name, unique per run
seed: 30
loglevel: INFO
mat_mul_precision: 'high'                 # faster float32 matmuls on recent gpus
run_test: false                           # true = test once on the test aois with best.ckpt after training

# shared by several configs
ring_cells: 1                             # modis cells around the 2 x 2 centre: 1 = 4 x 4 area (132 px), 2 = 6 x 6
window_days: 121                          # days of a window
history_days: 7                           # daily weather days before each day

hydra:
  run:
    dir: ${log_dir}                       # hydra outputs go into the run folder
